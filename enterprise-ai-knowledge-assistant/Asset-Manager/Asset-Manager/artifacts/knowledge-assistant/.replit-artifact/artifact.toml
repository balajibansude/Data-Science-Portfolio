kind = "web"
previewPath = "/"
title = "AI Knowledge Assistant"
version = "1.0.0"
id = "artifacts/knowledge-assistant"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19227

[services.development]
run = "pnpm --filter @workspace/knowledge-assistant run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/knowledge-assistant", "run", "build" ]
serve = "static"
publicDir = "artifacts/knowledge-assistant/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19227"
BASE_PATH = "/"
